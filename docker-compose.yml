services:

  db:
    image: postgres:16-alpine
    container_name: ppt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"           # keeps your local port 5433 working too
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ppt-ritey:latest    
    build: .
    container_name: ppt_app
    restart: unless-stopped
    ports:
      - "8080:8080"           # Streamlit — open http://localhost:8080
      - "8000:8000"           # FastAPI — optional direct access
    env_file:
      - .env
    environment:
      # Override localhost values from .env so they point to the db container
      DB_HOST: db
      DB_PORT: 5432
      PPT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      # Streamlit calls FastAPI on localhost inside the same container
      API_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: